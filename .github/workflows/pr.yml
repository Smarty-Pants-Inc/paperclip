name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - 'dl/img3-*'
      - 'dl/img2-pack-*'
      - 'fl/*'

concurrency:
  group: fork-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci')
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # The AWS runner group permits pr-trusted.yml@refs/heads/master.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@master

  pi_rpc_closure:
    name: Native Pi RPC closure
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select native Pi RPC closure changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          # Compare the tested merge tree to its first parent, not a stale PR base.
          # No rename detection: moving an input away must still select the check.
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD -- \
            packages/paperclip-runner/scripts/pi-rpc-distribution/ \
            packages/paperclip-runner/pi-rpc-distribution.json \
            packages/paperclip-runner/scripts/materialize-pi-rpc-distribution.mjs \
            packages/paperclip-runner/src/drivers/pi/pi-rpc-installation.ts \
            packages/paperclip-runner/src/drivers/pi/generated-distribution.ts)"
          if [[ -n "$changed" ]]; then
            echo 'closure=true' >> "$GITHUB_OUTPUT"
          else
            echo 'closure=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.closure == 'true'
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.changes.outputs.closure == 'true'
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        with:
          version: 9.15.4
          run_install: false
      - name: Install dependencies
        if: steps.changes.outputs.closure == 'true'
        run: pnpm install --frozen-lockfile
      - name: Materialize and verify the native Pi RPC closure
        if: steps.changes.outputs.closure == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @paperclipai/paperclip-runner build:typescript
          closure_root="$(mktemp -d "$RUNNER_TEMP/pi-rpc-closure.XXXXXX")"
          trap 'rm -rf -- "$closure_root"' EXIT
          # --check alone trusts the source pin; a real npm tree detects pin drift.
          node packages/paperclip-runner/scripts/materialize-pi-rpc-distribution.mjs "$closure_root/distribution"
          pnpm --filter @paperclipai/paperclip-runner check:pi-rpc-profile

  image_e2e:
    name: Image E2E shard (${{ matrix.shard }}/8)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false
      - name: Restore materialized dependencies and shared builds
        uses: ./.github/actions/setup-ci-dependencies
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF
      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          specs="$(node scripts/e2e-shard.mjs --shard-index $(( ${{ matrix.shard }} - 1 )) --shard-count 8)"
          echo "shard ${{ matrix.shard }}/8 specs: $specs"
          pnpm run test:e2e $specs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-playwright-report-${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
